# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - student-performance-api-pranav

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore backend/StudentPerformanceAnalytics.sln

      - name: Build solution
        run: dotnet build backend/StudentPerformanceAnalytics.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish backend/src/Infrastructure/StudentPerformanceAnalytics.Api/StudentPerformanceAnalytics.Api.csproj --configuration Release --no-build --output ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AAA4C74B8B0D4BA0A2C7C205F96B781F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BC0F8AE784F74C7AB2E6577A41633834 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3317EEECED2A45D584D7CBF21E625E9C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'student-performance-api-pranav'
          slot-name: 'Production'
          package: .
          